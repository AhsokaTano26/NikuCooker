# NikuCooker, in a container.
#
# The two images differ only in the machine they target, and the CUDA one is
# several gigabytes larger. They are separate services rather than one service
# with a variable because the GPU run also needs the device reservation below,
# which cannot be applied conditionally.
#
# Usage:
#
#   docker compose up -d                  # CPU
#   docker compose --profile cuda up -d cuda   # NVIDIA GPU
#
# Both mount the same three directories, so switching between them keeps every
# project, model and setting.

services:
  nikucooker:
    build:
      context: .
      target: runtime-cpu
    image: nikucooker:cpu
    container_name: nikucooker
    ports:
      - "8080:8080"
    volumes:
      # Projects and the database. This is the only one that holds work that
      # cannot be recreated.
      - ./data:/data
      # Recognition weights, which are large and re-downloadable.
      - ./models:/models
      # config.yaml, read through NIKUCOOKER_CONFIG.
      - ./config:/config
    environment:
      NIKUCOOKER_DATA_DIR: /data
      NIKUCOOKER_MODEL_DIR: /models
    restart: unless-stopped

  cuda:
    profiles: ["cuda"]
    build:
      context: .
      target: runtime-cuda
    image: nikucooker:cuda
    container_name: nikucooker-cuda
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./models:/models
      - ./config:/config
    environment:
      NIKUCOOKER_DATA_DIR: /data
      NIKUCOOKER_MODEL_DIR: /models
      # Tells the driver to expose only what this container needs, which is the
      # whole GPU for the transcribe and render passes.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    restart: unless-stopped

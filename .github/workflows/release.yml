name: Release

# Tag locally, push the tag, and this builds and publishes it.
#
#   git tag -a v0.1.0 -m v0.1.0
#   git push origin v0.1.0
#
# Pushing from your machine rather than from a workflow is what makes this a
# trigger at all: a tag pushed with the default GITHUB_TOKEN does not start
# other workflows, so a tag created inside Actions could not fire this.
#
# The ref is the tag, so GoReleaser reads the version from it — nothing has to
# be told what version it is building.
#
# Two things are published from one tag: the binaries as a GitHub release, and
# the CPU container image as tano26/nikucooker on Docker Hub. The image needs
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the repository's secrets — an
# access token from Docker Hub, not the account password.
on:
  push:
    tags:
      - 'v*'

  pull_request:
    # Without this, packaging is only ever exercised by a real release — so a
    # change that breaks the archive layout or one of the five cross-compiles is
    # discovered on release day, by the release that fails.
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml

  # A way to run the packaging without cutting a version: same build, nothing
  # published. Useful for trying a change to the configuration before a tag.
  workflow_dispatch:

permissions:
  contents: read

# Never cancelled. A release killed halfway has published part of a set of
# assets, and tags are not re-pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep Go's build cache in the module cache directory so the setup-go cache
  # action picks it up alongside the modules.
  GOFLAGS: -mod=readonly

jobs:
  verify:
    name: Verify
    # A tag push does not run CI — ci.yml watches main and pull requests — so
    # without this job a release would be the one build never tested.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          out=$(gofmt -l cmd internal pkg web)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi

      - name: Build
        # CGO_ENABLED=0 exercises the same code path the release matrix uses.
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Set up the AI worker environment
        # Without it the worker tests skip rather than fail, and a suite that
        # skips is not a check — which is the opposite of what this job is for.
        uses: astral-sh/setup-uv@v7

      - name: Install AI worker dependencies
        working-directory: ai
        run: uv sync --frozen

      - name: Cache recognition models
        # The ASR test needs weights, and the same cache CI fills.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/nikucooker
          key: models-tiny-${{ runner.os }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  release:
    name: Release
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Required for the changelog, which is built from the commits since
          # the previous tag.
          fetch-depth: 0

      - name: Check the tag
        # `v*` is a permissive filter — it matches `vnext` and `v2` as readily
        # as `v1.2.3`. Saying so here, in one line, beats failing four minutes
        # later inside a template with a message about incpatch.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "${TAG#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag '$TAG' is not a version; expected v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          # Pinned to the value in web/package.json, which corepack also uses
          # inside the Docker build and CI uses for the test suite.
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The Vue application is embedded into the binary by //go:embed, so it has
      # to be built before Go compiles — GoReleaser's own before-hooks do that.
      # Node and pnpm have to exist first, which is what the two steps above and
      # this comment are here to say.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The same CPU image CI builds on every change, pushed to Docker Hub.
  #
  # One runner per architecture rather than one emulated build. The arm64 image
  # carries a Python environment with ctranslate2 and onnxruntime in it, and
  # building that under QEMU takes long enough that a release would look hung.
  # Both runners are free for a public repository.
  image:
    name: Image (${{ matrix.platform }})
    needs: verify
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
            # The scope ci.yml writes under, so a release reuses the layers the
            # CI build already produced instead of starting from an empty
            # cache every time. Deliberately not derived from the platform
            # string, which would name a scope nothing else writes to.
            cache_scope: runtime-cpu
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            cache_scope: runtime-cpu-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: tano26/nikucooker

      - name: Timestamp
        id: stamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-cpu
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushed by digest, tagged later by a job that can see both
          # architectures at once. Tagging here would publish a manifest that
          # resolves to amd64 and then, a few minutes later, to arm64 — so
          # whoever pulled in between got an image chosen by timing.
          outputs: type=image,name=tano26/nikucooker,push-by-digest=true,name-canonical=true,push=true
          # Without these the binary reports "dev" and, worse, carries a
          # codeRevision of "unknown" — which is the component that makes the
          # artifact cache safe across upgrades. See docs/artifact-cache.md §2.2.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            CODE_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          # One artifact per architecture; the merge job collects them all.
          # The platform string carries a slash and cannot be an artifact name.
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Gives the two digests one set of tags, as a manifest list.
  image-tags:
    name: Image tags
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: tano26/nikucooker
          # 0.1.0 from the tag, and latest — which the default `latest=auto`
          # flavor attaches to a release but not to a `-rc.1`.
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Create the manifest
        working-directory: /tmp/digests
        run: |
          # Every architecture must be here before anything is tagged. The
          # build jobs pushed their images by digest and gave them no tags, so
          # the digests are the only reference to them — and a manifest built
          # from one digest would put a multi-architecture tag on an image that
          # only runs on one architecture.
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::expected 2 architecture digests, found ${#digests[@]}"
            ls -la
            exit 1
          fi

          echo "tags: ${DOCKER_METADATA_OUTPUT_TAGS}"

          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${digests[@]/#/tano26/nikucooker@sha256:}"

      - name: Report what was published
        run: docker buildx imagetools inspect tano26/nikucooker:${{ steps.meta.outputs.version }}

  package:
    name: Package (dry run)
    # The whole matrix, built and archived exactly as a release would, without
    # publishing anything. A configuration error is a two-minute failure here
    # rather than a release that stops halfway.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Validate the configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

      - name: Build every target without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

# Tag locally, push the tag, and this builds, verifies, and publishes it.
#
#   git tag -a v0.1.0 -m v0.1.0
#   git push origin v0.1.0
#
# Pushing from your machine rather than from a workflow is what makes this a
# trigger at all: a tag pushed with the default GITHUB_TOKEN does not start
# other workflows, so a tag created inside Actions could not fire this.
#
# The ref is the tag, so GoReleaser reads the version from it — nothing has to
# be told what version it is building.
#
# One thing is published from one tag: the binaries, as a GitHub release.
on:
  push:
    tags:
      - 'v*'

  pull_request:
    # Without this, packaging is only ever exercised by a real release — so a
    # change that breaks the archive layout or one of the five cross-compiles is
    # discovered on release day, by the release that fails.
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      # The packaging scripts decide what ends up in an archive, so a change to
      # one of them is a change to the packaging.
      - scripts/**

  # A way to run the packaging without cutting a version: same build, nothing
  # published. Useful for trying a change to the configuration before a tag.
  workflow_dispatch:

permissions:
  contents: read

# Never cancelled. A release killed halfway has published part of a set of
# assets, and tags are not re-pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep Go's build cache in the module cache directory so the setup-go cache
  # action picks it up alongside the modules.
  GOFLAGS: -mod=readonly

jobs:
  verify:
    name: Verify
    # A tag push does not run CI — ci.yml watches main and pull requests — so
    # without this job a release would be the one build never tested.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          out=$(gofmt -l cmd internal pkg web)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi

      - name: Install FFmpeg
        # The runner image does not ship it, and the suite cannot run without
        # it: `app.New` refuses to build when the tools are missing, so the
        # integration tests fail rather than skip. Ubuntu's package is built
        # with libass, which is what the hard-subtitle path needs.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Build
        # CGO_ENABLED=0 exercises the same code path the release matrix uses.
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Set up the AI worker environment
        # Without it the worker tests skip rather than fail, and a suite that
        # skips is not a check — which is the opposite of what this job is for.
        uses: astral-sh/setup-uv@v7

      - name: Install AI worker dependencies
        working-directory: ai
        run: uv sync --frozen

      - name: Cache recognition models
        # The ASR test needs weights, and the same cache CI fills.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/nikucooker
          key: models-tiny-${{ runner.os }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  release:
    name: Release
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Required for the changelog, which is built from the commits since
          # the previous tag.
          fetch-depth: 0

      - name: Check the tag
        # `v*` is a permissive filter — it matches `vnext` and `v2` as readily
        # as `v1.2.3`. Saying so here, in one line, beats failing four minutes
        # later inside a template with a message about incpatch.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "${TAG#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag '$TAG' is not a version; expected v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          # Pinned to the value in web/package.json, which corepack also reads
          # and CI uses for the test suite.
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # GoReleaser shells out to syft to catalog each archive, and a runner has
      # no syft on it. Without this step the release builds every target, gets
      # to the SBOM, and fails there — which is what the first tagged release
      # did, two minutes in, with nothing published.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      # The Vue application is embedded into the binary by //go:embed, so it has
      # to be built before Go compiles — GoReleaser's own before-hooks do that.
      # Node and pnpm have to exist first, which is what the two steps above and
      # this comment are here to say.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check what the archives contain
        # The same check the package job runs on a pull request, run again here
        # because this is a different set of archives: the ones that are about
        # to be published. A glob that flattens a directory, or a uv release
        # that changed shape since the pull request was merged, produces an
        # archive that lists correctly and cannot import its own package.
        #
        # After the upload rather than before it, because GoReleaser uploads as
        # it goes — but the release is a draft, so this failing leaves assets
        # nobody has published and a draft to delete.
        run: ./scripts/verify-archive.sh dist

      - name: Publish verified release
        # Keep the upload private until every archive has passed the structural
        # check above. Publishing here closes the loop automatically: a
        # successful tag workflow always leaves a visible Latest release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest

  package:
    name: Package (dry run)
    # The whole matrix, built and archived exactly as a release would, without
    # publishing anything. A configuration error is a two-minute failure here
    # rather than a release that stops halfway.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # GoReleaser shells out to syft to catalog each archive, and a runner has
      # no syft on it. Without this step the release builds every target, gets
      # to the SBOM, and fails there — which is what the first tagged release
      # did, two minutes in, with nothing published.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Validate the configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

      - name: Build every target without publishing
        # The before-hooks run here too, so this also downloads and verifies the
        # uv copies that ship in the archives — one per target, about 100 MB in
        # total. That is the point: a change to uv's release layout fails this
        # job rather than a user's first install.
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check what the archives contain
        # The configuration above cannot be read to answer this. A glob that
        # flattens a directory, or an include-list that misses a file, produces
        # an archive that lists correctly and cannot import its own package —
        # so this compares the whole ai/ tree, and asserts the bundled uv is
        # where the binary will look for it.
        run: ./scripts/verify-archive.sh dist

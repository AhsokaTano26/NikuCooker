name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's results irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep Go's build cache in the module cache directory so the setup-go cache
  # action picks it up alongside the modules.
  GOFLAGS: -mod=readonly

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Path handling, process spawning and file locking differ enough between
        # the three that a Linux-only CI would let portability bugs through
        # until release. See NFR-PORT-1.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l cmd internal pkg web)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi
        shell: bash

      - name: Install FFmpeg
        # None of the runner images ship it: Ubuntu 24.04 lists neither ffmpeg
        # nor ffprobe, and neither does the macOS image.
        #
        # It cannot be skipped, because it is not an optional extra of the
        # product — the media stages run it, `app.New` refuses to build without
        # it, and the integration suite constructs an application. So without
        # this the suite does not degrade to skipping; it fails outright.
        #
        # Ubuntu's package is built with libass, which is what the hard-subtitle
        # path needs. Homebrew's is not, so that one test skips on macOS — which
        # is a genuine capability difference of the platform's default build,
        # not a hole in the CI.
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Build
        # CGO_ENABLED=0 exercises the same code path the release matrix uses.
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Set up the AI worker environment
        # The worker IPC tests spawn a real Python process. Without this they
        # skip, and a suite that silently skips is a suite that stops being run.
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v7

      - name: Install AI worker dependencies
        if: runner.os == 'Linux'
        working-directory: ai
        run: uv sync --frozen

      - name: Cache recognition models
        # The ASR test needs weights. Caching them keeps the suite fast; a test
        # that takes minutes of downloading is a test someone disables.
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/nikucooker
          key: models-tiny-${{ runner.os }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      - name: golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned, which is what .golangci.yml says it is for: an unpinned
          # linter set means a dependency upgrade can start failing CI for
          # reasons unrelated to the change that triggered it. That is what
          # `latest` did — a new release added rules, the job went red on a
          # commit that had not touched Go, and the failure looked like the
          # change's fault. Raise this deliberately, in its own commit.
          version: v2.13.2
          args: --timeout=5m

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          # The range is >=3.12,<3.15. Testing the other end on one OS catches a
          # ceiling that moves without the whole matrix growing.
          - os: ubuntu-latest
            python: '3.14'
    env:
      # Every `uv run` below repeats the sync's flags, and it is not redundant.
      #
      # `uv run` re-syncs the environment to the project's own defaults before
      # running anything: the interpreter from `.python-version`, and the
      # default dependency set with no extras. So on the 3.14 leg it replaced
      # the environment the step above had just built, dropped the dev group —
      # and then failed to find ruff, which it had uninstalled a moment earlier.
      #
      # Naming the interpreter and the extras on each command is what keeps the
      # environment the one this matrix asked for. (`--no-sync` is the other
      # candidate and is worse: uv warns that the environment is incompatible
      # and uses it anyway, so the 3.14 leg would quietly test 3.12.)
      UV_RUN: uv run --frozen --extra dev --python ${{ matrix.python }}
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ai/uv.lock

      - name: Install
        # --frozen makes the build fail if uv.lock is out of step with
        # pyproject.toml, rather than silently resolving a different set.
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}

      - name: Lint
        run: ${{ env.UV_RUN }} ruff check .

      - name: Format check
        run: ${{ env.UV_RUN }} ruff format --check .

      - name: Type check
        run: ${{ env.UV_RUN }} pyright

      - name: Test
        run: ${{ env.UV_RUN }} pytest

      - name: Self-check
        # Proves the entry point, the stdout discipline and the schema digest all
        # work in a clean environment on this platform.
        run: ${{ env.UV_RUN }} python -m nikucooker_ai --selfcheck

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          # Pinned to the value in web/package.json, which corepack also reads.
          # A drifting pnpm between CI and a developer machine is how a build
          # passes in one place and fails in another.
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        # TypeScript strict. A type error is a build failure, not a warning.
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

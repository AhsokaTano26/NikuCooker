# GoReleaser configuration.
#
#   goreleaser release --snapshot --clean     # local dry run
#
# Validate with `goreleaser check`. See docs/deployment.md §5.

version: 2

project_name: nikucooker

before:
  hooks:
    # The web application is embedded, so it has to exist before Go compiles.
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build
    # Stages one uv per target into build/uv/<goos>_<goarch>/. Downloaded and
    # checksum-verified here rather than per archive, because a release asset
    # name is not the same thing as a GOOS/GOARCH pair — see the script, which
    # is the only place that translation lives.
    - ./scripts/fetch-uv.sh

builds:
  - id: nikucooker
    main: ./cmd/nikucooker
    binary: nikucooker
    env:
      # CGO-free is what makes this matrix a list rather than five toolchains.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      # Not cosmetic: codeRevision participates in every artifact cache key, so
      # it is what stops a new binary from serving output produced by an older
      # implementation. See docs/artifact-cache.md §2.2.
      - -X main.codeRevision={{ .Commit }}
      - -X main.buildDate={{ .Date }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # No Windows arm64 Python stack exists in practice; shipping a binary that
      # cannot find a worker would be a promise we cannot keep.
      - goos: windows
        goarch: arm64

archives:
  - id: nikucooker
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      # Shipped because README.md points at it. A pointer to a file that is not
      # in the archive is worse than no pointer: it reads as a missing file
      # rather than as documentation that lives elsewhere.
      - INSTALL.md

      # --- the AI worker's source -------------------------------------------
      #
      # Plain paths, not src/dst mappings. A mapping whose `src` names a single
      # file resolves its destination to the `dst` string itself and drops the
      # file name, so four files written that way all claim one name and only
      # the first survives — with no warning. That is how an archive shipped
      # without a pyproject.toml in it.
      - ai/pyproject.toml
      - ai/uv.lock
      # pyproject.toml declares it, and uv builds the project itself before
      # syncing dependencies — without it, hatchling fails with "Readme file
      # does not exist".
      - ai/README.md
      - ai/.python-version

      # The package, in two entries rather than one `**/*.py`: `**` in this
      # glob requires a directory in between, so `a/**/*.py` matches `a/b/c.py`
      # and not `a/c.py`. One entry shipped the subpackages and none of the
      # modules beside them — no worker.py, no __main__.py, an install that
      # could not run.
      - ai/nikucooker_ai/*.py
      # Recursive, and matching only `.py`, because the alternative — listing
      # the directory — brings the __pycache__ trees with it, and a bytecode
      # cache in an archive bakes in the builder's absolute paths.
      - src: ai/nikucooker_ai/**/*.py
        dst: ai/nikucooker_ai

      # --- what the worker reads at runtime ----------------------------------
      #
      # The protocol fixtures. The worker derives its schema digest from them,
      # and a worker whose digest does not match the core's refuses to handshake
      # — so without these the binary in an archive is a decoder that cannot
      # start a recogniser at all.
      #
      # The path is not decoration. schema.py resolves it as parents[3] of its
      # own file, which is the archive root, so it has to sit at
      # pkg/protocol/testdata beside ai/ and nothing else will do.
      - pkg/protocol/testdata

      # --- the installer ------------------------------------------------------
      #
      # The uv staged by the before-hook, one per target.
      #
      # `src` is templated per archive and `dst` is not — `dst: uv{{ if eq .Os
      # "windows" }}.exe{{ end }}` produced a file with those braces still in
      # its name — so the destination is expressed by stripping the parent
      # instead: the file lands at the archive root under its own name, `uv` or
      # `uv.exe`, which is where the binary looks for it.
      - src: build/uv/{{ .Os }}_{{ .Arch }}/uv{{ if eq .Os "windows" }}.exe{{ end }}
        strip_parent: true

checksum:
  name_template: checksums.txt

sboms:
  # The binaries, not the archives.
  #
  # syft reads a .tar.gz as if it were a container image and gives up on the
  # first entry — "failed to create file in destination: is a directory" — which
  # is where the first two tagged releases died, two minutes in. A Go binary it
  # reads directly, module list and all, and that is the document worth having:
  # the dependencies are compiled into it, so the binary is what the SBOM is a
  # bill of materials *for*. One per target, named for it.
  - artifacts: binary

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  groups:
    - title: 新增功能
      regexp: '^feat(\([[:alnum:]_-]+\))?(!)?: .+$'
      order: 0
    - title: 问题修复
      regexp: '^fix(\([[:alnum:]_-]+\))?(!)?: .+$'
      order: 1
    - title: 其他改进
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: true
  # GoReleaser uploads into a draft so the workflow can inspect the finished
  # archives before making them public. The final workflow step publishes the
  # verified draft and marks it as the latest release.
  header: |
    ## 本次更新

    以下内容根据自上一个版本以来的提交自动整理。功能、修复和其他改进
    会分别列出，便于在下载前快速了解这个版本发生了什么变化。

  footer: |
    ## Installation

    Extract the archive and run the binary. The web interface is embedded in it,
    and so is everything the AI worker needs except Python itself.

    Open <http://localhost:8080/system> and click once to install the AI
    environment — a Python interpreter and the recognition dependencies, about
    300 MB, downloaded once into the data directory. Nothing is downloaded
    before you click.

    On a machine with an NVIDIA card the same page offers the GPU set beside the
    default: about 700 MB more, and considerably faster. The option is only
    offered where it can work, and says why when it cannot.

    FFmpeg and ffprobe must be on your PATH. `nikucooker doctor` checks
    everything and says what to do about whatever is missing.

    See [INSTALL.md](https://github.com/AhsokaTano26/NikuCooker/blob/main/INSTALL.md)
    for the platform-specific steps.

    On a server, run the same binary under a service manager. It listens on
    loopback by default: `--host 0.0.0.0` exposes it, and this build has no
    authentication, so put it behind a reverse proxy that does.

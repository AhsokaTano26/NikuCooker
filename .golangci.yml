# golangci-lint configuration.
#
# Pinned rather than left to the tool's defaults: an unpinned linter set means
# a dependency upgrade can start failing CI for reasons unrelated to the change
# that triggered it. The pin is in .github/workflows/ci.yml.
#
# Everything below either enables a check or records why one is off. A rule that
# is off without a reason under it is a rule nobody will ever turn back on.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    # Catches a wrapped error that is discarded, which is how a failure becomes
    # a mystery three layers up.
    - errorlint
    # Unchecked type assertions panic at runtime; this finds them at lint time.
    - forcetypeassert
    # An unclosed response body or file descriptor is invisible until a long
    # run exhausts descriptors — plausible here, where stage workers open files
    # in a loop.
    - bodyclose
    # Security-adjacent checks. Relevant because this project shells out to
    # FFmpeg and builds paths from user input.
    - gosec
    # Subprocess and loop-variable mistakes, which the worker supervisor and the
    # event fan-out are both exposed to.
    - gocritic
    - unconvert
    - wastedassign
    #
    # NOT enabled: noctx.
    #
    # It is a good linter and this is the one entry here that hides work worth
    # doing rather than noise. The 21 findings are real — `os/exec.Command` where
    # `CommandContext` would let a hung child be cancelled, `net.Listen` where
    # `ListenConfig` would take the shutdown context, and `database/sql` calls
    # without one — and every one of them needs a context plumbed to a place
    # that does not have it yet. That is a change of its own, not part of the
    # commit that turns a red job green. Several sites do have a cancel path by
    # other means (the worker pool kills its children explicitly, the server
    # shuts down through its own context), so the exposure is smaller than the
    # count suggests, and it is not zero.

  settings:
    errcheck:
      exclude-functions:
        # Writes to a ResponseWriter and Close on a deferred handle are two
        # places an ignored error is genuinely correct.
        - (net/http.ResponseWriter).Write
        - (*os.File).Close
        # The third: a close on a read-only handle, where the error is reported
        # by rows.Err() — which every one of these call sites checks. Closing
        # can only repeat what the iteration already said.
        - (*database/sql.Rows).Close
        # The fourth: output. These are the CLI's progress lines and doctor's
        # report, written to a terminal or to whatever the caller redirected to.
        # A failure to write there — a closed pipe, a full disk on the far end —
        # is not something this program can act on, and printing a second error
        # about failing to print the first one is not an improvement.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # Single-case switches are clearer than if-chains in the protocol
        # decoder, where each case mirrors a wire value.
        - singleCaseSwitch
        # hugeParam and rangeValCopy want configuration structs passed by
        # pointer and range loops indexed instead of ranged. Both are wrong for
        # this codebase: the structs — a stage's options, a provider's
        # settings — are values on purpose, because they are built once,
        # handed to a constructor and never mutated through the callee, and
        # pointer-passing trades that for aliasing to save a copy at
        # process-startup frequency. The linter's threshold is 80 bytes.
        - hugeParam
        - rangeValCopy
        # filepath.Join("a", "b") where the first argument contains a separator
        # is exactly what a Join is for here — the alternative the check
        # suggests reads worse at every call site.
        - filepathJoin
        # appendCombine wants `append(a, b, c)` where the code appends one
        # argument per line, each with the comment that says why it is there.
        # appendAssign flags the filter-in-place idiom — `xs = append(xs[:0],
        # kept...)` — which is safe precisely because the write index never
        # passes the read index.
        - appendCombine
        - appendAssign

    gosec:
      excludes:
        # File paths are built by the storage layer from server-generated IDs,
        # never from user input; see docs/requirements.md FR-SEC-2. The rule
        # cannot see that, so it is suppressed here rather than ignored inline
        # at each call site. G703 is the same rule against a taint model.
        - G304
        - G703
        # Subprocess arguments are always passed as a vector, never a shell
        # string (NFR-PORT-5). G204 flags any variable argument.
        - G204
        # SQL built by concatenation where the concatenated parts are code —
        # a fixed set of WHERE clauses and ORDER BY terms chosen by a switch.
        # Every value the user supplies is a bound parameter.
        - G202
        # File and directory modes. The rule's default assumes a secret, and
        # what these are is the opposite: logs, generated subtitles, downloaded
        # models and the manifest, in the user's own data directory, which the
        # user is meant to be able to read and delete. Tightening them to 0600
        # would make the program's own output unreadable to the person who
        # asked for it.
        - G301
        - G302
        - G306
        # Converting a byte count between int64 and uint64. The values are
        # memory and disk sizes: the uint64 sources are a machine's total RAM
        # and free space, and the sign bit is not in question at either end.
        - G115
        # A slice index guarded by the condition immediately beside it. The
        # rule's analysis does not follow `i > 0 && words[i-1]`, where Go's
        # short-circuit makes the guard the reason the index is safe.
        - G602

  exclusions:
    rules:
      # Tests build deliberately malformed input and use long literals.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - forcetypeassert

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/AhsokaTano26/NikuCooker
